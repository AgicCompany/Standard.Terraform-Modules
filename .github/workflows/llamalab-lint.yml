name: LlamaLab Manifest Lint

on:
  pull_request:
    paths:
      - 'modules/**/manifest.yaml'
      - 'tools/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect modules to lint
        id: changes
        run: |
          # If the tool itself changed, re-lint every module that has a manifest
          TOOL_CHANGED=$(git diff --name-only origin/main...HEAD -- tools/ | wc -l)
          if [ "$TOOL_CHANGED" -gt 0 ]; then
            echo "Tool changed — linting all modules with a manifest"
            MODULES=$(find modules -name manifest.yaml -maxdepth 2 \
              | cut -d'/' -f2 | sort -u \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          else
            MODULES=$(git diff --name-only origin/main...HEAD -- 'modules/**/manifest.yaml' \
              | cut -d'/' -f2 | sort -u \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "Modules to lint: $MODULES"

  lint-manifests:
    needs: detect-changes
    if: needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install lint tool dependencies
        run: pip install -r tools/requirements.txt

      - name: Lint manifest
        run: |
          python -m tools.llamalab_lint.cli \
            --framework . \
            modules/${{ matrix.module }}/manifest.yaml

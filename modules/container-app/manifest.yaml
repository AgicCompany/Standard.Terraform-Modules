schema_version: "0.1"

metadata:
  module_name: container-app
  module_version: "1.3.0"
  schema_authored_by: AGIC Infrastructure Team
  schema_last_updated: "2026-06-19"

catalogue:
  display_name: "Container App"
  short_description: "Azure Container App with ingress, scaling, secrets, and managed identity."
  long_description: |
    Azure Container App running inside a Container Apps Environment.
    Supports HTTP/TCP ingress with external or internal exposure, secret
    injection (plain values), private registry authentication via managed
    identity or credentials, autoscaling rules, and both system-assigned
    and user-assigned managed identities.
  category: compute
  subcategory: containers
  icon: container-app
  complexity: high
  cost_tier: low
  deprecated: false
  tags:
    - containers
    - serverless
    - container-apps
    - ingress
    - scaling

variables:
  # --- Deployment-context derived ---
  resource_group_name:
    widget: hidden
    derived_from: { source: deployment_context.resource_group }

  # NOTE: container-app module does not declare a location variable;
  # location is inherited from the Container Apps Environment.

  name:
    widget: hidden
    derived_from: { source: naming.container_app }

  tags:
    widget: hidden
    derived_from: { source: deployment_context.tags }

  # --- Core configuration ---
  container_app_environment_id:
    widget: resource_picker
    widget_options: { resource_type: container_app_environment }
    group: core
    order: 10
    help: "Container Apps Environment hosting this app. Required."

  container:
    widget: object
    widget_options:
      fields:
        image:
          widget: text
          placeholder: "myregistry.azurecr.io/myapp:latest"
          help: "Container image reference."
        cpu:
          widget: number
          widget_options: { min: 0.25, max: 4, step: 0.25 }
          help: "vCPU allocation (e.g. 0.25, 0.5, 1)."
        memory:
          widget: text
          placeholder: "0.5Gi"
          help: "Memory allocation (e.g. 0.5Gi, 1Gi, 2Gi)."
        env:
          widget: key_value_map
          help: "Environment variables. For secrets, set the value to the secret name and reference it via secret_name."
        liveness_probe:
          widget: object
          widget_options:
            fields:
              transport:
                widget: select
                widget_options:
                  options: ["HTTP", "HTTPS", "TCP"]
              port: { widget: number }
              path: { widget: text, placeholder: "/health" }
              initial_delay: { widget: number, widget_options: { min: 0 } }
              interval_seconds: { widget: number, widget_options: { min: 1 } }
              failure_count_threshold: { widget: number, widget_options: { min: 1 } }
        readiness_probe:
          widget: object
          widget_options:
            fields:
              transport:
                widget: select
                widget_options:
                  options: ["HTTP", "HTTPS", "TCP"]
              port: { widget: number }
              path: { widget: text, placeholder: "/ready" }
              initial_delay: { widget: number, widget_options: { min: 0 } }
              interval_seconds: { widget: number, widget_options: { min: 1 } }
              failure_count_threshold: { widget: number, widget_options: { min: 1 } }
        startup_probe:
          widget: object
          widget_options:
            fields:
              transport:
                widget: select
                widget_options:
                  options: ["HTTP", "HTTPS", "TCP"]
              port: { widget: number }
              path: { widget: text, placeholder: "/startup" }
              initial_delay: { widget: number, widget_options: { min: 0 } }
              interval_seconds: { widget: number, widget_options: { min: 1 } }
              failure_count_threshold: { widget: number, widget_options: { min: 1 } }
    group: core
    order: 20
    help: "Main container configuration: image, resources, environment variables, and health probes."

  revision_mode:
    widget: select
    widget_options: { derive_from_validation: true }
    group: core
    order: 30
    help: "Single = one active revision. Multiple = traffic-split across revisions."

  workload_profile_name:
    widget: text
    group: core
    order: 40
    advanced: true
    placeholder: "Consumption"
    help: "Workload profile from the environment. Leave empty for the Consumption profile."

  registries:
    widget: repeater
    widget_options:
      mode: ordered_list
      row_fields:
        server:
          widget: text
          placeholder: "myregistry.azurecr.io"
          help: "Registry server hostname."
        identity:
          widget: resource_picker
          widget_options: { resource_type: user_assigned_identity }
          help: "UAMI for registry auth. Must be listed in user_assigned_identity_ids."
        username:
          widget: text
          help: "Registry username. Use with password_secret_name."
        password_secret_name:
          widget: text
          help: "Secret name containing the registry password."
      add_label: "Add registry"
    group: core
    order: 50
    help: "Private registry authentication. Use either 'identity' or 'username + password_secret_name', not both."

  init_containers:
    widget: repeater
    widget_options:
      mode: ordered_list
      row_fields:
        image: { widget: text, placeholder: "myregistry.azurecr.io/init:latest" }
        name: { widget: text }
        cpu: { widget: number, widget_options: { min: 0.25, step: 0.25 } }
        memory: { widget: text, placeholder: "0.5Gi" }
        command:
          widget: text
          widget_options: { multiline: true }
          help: "Command override, one token per line."
        args:
          widget: text
          widget_options: { multiline: true }
          help: "Arguments, one per line."
        env:
          widget: key_value_map
          help: "Environment variables."
      add_label: "Add init container"
    group: core
    order: 60
    advanced: true
    help: "Init containers to run before the main container."

  # --- Networking ---
  enable_ingress:
    widget: toggle
    group: networking
    order: 10
    help: "Enable HTTP/TCP ingress on this app."

  enable_external_ingress:
    widget: toggle
    group: networking
    order: 20
    help: "Allow ingress from outside the Container Apps Environment."
    show_when:
      enable_ingress: true

  ingress:
    widget: object
    widget_options:
      fields:
        target_port:
          widget: number
          widget_options: { min: 1, max: 65535 }
          help: "Container port to forward ingress traffic to."
        transport:
          widget: select
          widget_options:
            options: ["auto", "http", "http2", "tcp"]
          help: "Transport protocol. 'auto' detects HTTP/2."
        traffic_weight:
          widget: object
          widget_options:
            fields:
              latest_revision: { widget: toggle }
              percentage:
                widget: number
                widget_options: { min: 0, max: 100 }
    group: networking
    order: 30
    help: "Ingress configuration. Only used when enable_ingress is true."
    show_when:
      enable_ingress: true
    required_when:
      enable_ingress: true

  # --- Security ---
  secrets:
    widget: key_value_map
    group: security
    order: 10
    help: "App secrets. Key = secret name, value = secret value. Reference secrets from container env vars."

  # --- Identity ---
  enable_system_assigned_identity:
    widget: toggle
    group: identity
    order: 10
    help: "Enable system-assigned managed identity on the Container App."

  user_assigned_identity_ids:
    widget: resource_picker
    widget_options:
      resource_type: user_assigned_identity
      multiple: true
    group: identity
    order: 20
    help: "User-assigned managed identities. Required for registry auth via identity."

  # --- Scaling ---
  scale:
    widget: object
    widget_options:
      fields:
        min_replicas:
          widget: number
          widget_options: { min: 0, max: 300 }
          help: "Minimum replica count. 0 allows scale-to-zero."
        max_replicas:
          widget: number
          widget_options: { min: 1, max: 300 }
          help: "Maximum replica count."
        rules:
          widget: repeater
          widget_options:
            mode: ordered_list
            row_fields:
              name: { widget: text }
              http_scale_rule:
                widget: object
                widget_options:
                  fields:
                    concurrent_requests:
                      widget: text
                      placeholder: "10"
                      help: "Concurrent requests threshold to trigger scaling."
            add_label: "Add scale rule"
          help: "Scale rules (e.g. HTTP concurrent requests)."
    group: scaling
    order: 10
    help: "Scale settings. Defaults to 0–10 replicas with no rules."

  # --- Monitoring ---
  diagnostic_settings:
    widget: object
    widget_options:
      fields:
        name:
          widget: text
          placeholder: "diag-<app-name>"
        log_analytics_workspace_id:
          widget: resource_picker
          widget_options: { resource_type: log_analytics_workspace }
        storage_account_id:
          widget: resource_picker
          widget_options: { resource_type: storage_account }
        eventhub_authorization_rule_id:
          widget: text
        eventhub_name:
          widget: text
        log_analytics_destination_type:
          widget: select
          widget_options:
            options: ["Dedicated", "AzureDiagnostics"]
        enabled_log_categories:
          widget: text
          widget_options: { multiline: true }
          help: "One category per line. Leave empty for all supported."
        enabled_metrics:
          widget: text
          widget_options: { multiline: true }
          help: "One metric per line. Leave empty for all supported."
    group: monitoring
    order: 10
    advanced: true
    help: "Optional. Leave blank to disable diagnostic settings."

dependencies:
  required_inputs_from_other_resources:
    - variable: container_app_environment_id
      resource_type: container_app_environment
      cardinality: one
      notes: "Container Apps Environment hosting this app. Required."

    - variable: user_assigned_identity_ids
      resource_type: user_assigned_identity
      cardinality: many
      notes: "Required when using identity-based registry auth."

    - variable: diagnostic_settings.log_analytics_workspace_id
      resource_type: log_analytics_workspace
      cardinality: one
      notes: "Optional diagnostic sink."

  produces_outputs_consumable_by:
    - output: id
      resource_type: container_app
    - output: latest_revision_fqdn
      resource_type: container_app_fqdn

outputs_display:
  id:
    display_name: "Resource ID"
    show_in_summary: true
    copyable: true
    format: arm_id

  name:
    display_name: "Container App name"
    show_in_summary: true
    copyable: true

  latest_revision_fqdn:
    display_name: "Latest revision FQDN"
    show_in_summary: true
    copyable: true
    format: url

  latest_revision_name:
    display_name: "Latest revision name"
    show_in_summary: true
    copyable: true

  outbound_ip_addresses:
    display_name: "Outbound IP addresses"
    show_in_summary: false
    copyable: true

  principal_id:
    display_name: "System identity principal ID"
    show_in_summary: false
    copyable: true

  tenant_id:
    display_name: "Tenant ID"
    show_in_summary: false
    copyable: true

  public_container_app_id:
    display_name: "Resource ID (public)"
    show_in_summary: false
    copyable: true
    format: arm_id
    role: public_alias

  public_container_app_name:
    display_name: "Container App name (public)"
    show_in_summary: false
    copyable: true
    role: public_alias

  public_container_app_fqdn:
    display_name: "Latest revision FQDN (public)"
    show_in_summary: false
    copyable: true
    format: url
    role: public_alias

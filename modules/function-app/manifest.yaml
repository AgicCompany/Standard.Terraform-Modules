schema_version: "0.1"

metadata:
  module_name: function-app
  module_version: "3.0.0"
  schema_authored_by: AGIC Infrastructure Team
  schema_last_updated: "2026-06-19"

catalogue:
  display_name: "Function App (Classic)"
  short_description: "Azure Linux Function App on a dedicated App Service Plan with private endpoint and secure defaults."
  long_description: |
    Azure Linux Function App (classic, dedicated App Service Plan) with security-first defaults:
    private endpoint enabled, public access disabled. Supports .NET, Python, Node.js, Java,
    PowerShell, custom, and Docker runtimes, VNet integration for outbound traffic, managed
    identity, and optional Application Insights and diagnostic settings.
  category: compute
  subcategory: serverless
  icon: function-app
  complexity: high
  cost_tier: low
  deprecated: false
  tags:
    - serverless
    - functions
    - classic
    - private-endpoint
    - vnet

variables:
  # --- Deployment-context derived ---
  resource_group_name:
    widget: hidden
    derived_from: { source: deployment_context.resource_group }

  location:
    widget: hidden
    derived_from: { source: deployment_context.location }

  name:
    widget: hidden
    derived_from: { source: naming.function_app }

  tags:
    widget: hidden
    derived_from: { source: deployment_context.tags }

  # --- Core configuration ---
  service_plan_id:
    widget: resource_picker
    widget_options: { resource_type: app_service_plan }
    group: core
    order: 10
    help: "Dedicated App Service Plan (Basic, Standard, Premium, or Isolated) to host this Function App."

  storage_account_name:
    widget: text
    group: core
    order: 20
    placeholder: "e.g. stmyfunctionruntime"
    help: "Name of the Azure Storage Account used by the Functions runtime for state, triggers, and binding storage."

  storage_account_access_key:
    widget: text
    group: core
    order: 30
    sensitive_override: true
    placeholder: "base64-encoded storage access key"
    help: "Access key for the storage account. Treated as a secret. Wire from a storage-account module output in production."

  application_stack:
    widget: object
    widget_options:
      fields:
        dotnet_version:
          widget: text
          placeholder: "e.g. 8.0"
          help: ".NET version (e.g. 6.0, 8.0). Pair with use_dotnet_isolated_runtime."
        use_dotnet_isolated_runtime:
          widget: toggle
          help: "Run the function on the .NET isolated worker model (recommended for .NET 8+)."
        java_version:
          widget: text
          placeholder: "e.g. 17"
          help: "Java version (e.g. 8, 11, 17, 21)."
        node_version:
          widget: text
          placeholder: "e.g. 20"
          help: "Node.js version (e.g. 18, 20)."
        python_version:
          widget: text
          placeholder: "e.g. 3.11"
          help: "Python version (e.g. 3.9, 3.10, 3.11)."
        powershell_core_version:
          widget: text
          placeholder: "e.g. 7.2"
          help: "PowerShell Core version (e.g. 7.2, 7.4)."
        use_custom_runtime:
          widget: toggle
          help: "Use a custom runtime handler. Requires a handler binary in the deployment package."
        docker:
          widget: object
          widget_options:
            fields:
              image_name:
                widget: text
                placeholder: "myorg/myimage"
                help: "Docker image name without tag."
              image_tag:
                widget: text
                placeholder: "latest"
                help: "Docker image tag."
              registry_url:
                widget: text
                placeholder: "https://index.docker.io"
                help: "Container registry URL. Leave blank for Docker Hub."
              registry_username:
                widget: text
                placeholder: "registry username"
                help: "Registry username for private registries."
              registry_password:
                widget: text
                help: "Registry password for private registries. Treat as a secret."
    group: core
    order: 40
    help: "Application stack. Populate exactly one runtime section (dotnet, java, node, python, powershell, custom, or docker). Leave blank to inherit the plan default."

  app_settings:
    widget: key_value_map
    group: core
    order: 50
    sensitive_override: true
    help: "Application settings injected as environment variables. Managed by dev teams via CI/CD after initial deployment."

  functions_extension_version:
    widget: text
    group: core
    order: 60
    advanced: true
    placeholder: "~4"
    help: "Functions host runtime version pin. ~4 tracks the latest v4 patch. Rarely needs changing."

  # --- Identity ---
  enable_system_assigned_identity:
    widget: toggle
    group: identity
    order: 10
    help: "Enable the system-assigned managed identity on this Function App."

  user_assigned_identity_ids:
    widget: resource_picker
    widget_options: { resource_type: user_assigned_identity, multiple: true }
    group: identity
    order: 20
    help: "User-assigned managed identity resource IDs to attach to this Function App."

  # --- Security ---
  enable_public_access:
    widget: toggle
    group: security
    order: 10
    help: "Allow public network access. When false the Function App is reachable only via private endpoints. Keep false for production workloads."

  # --- Networking ---
  enable_vnet_integration:
    widget: toggle
    group: networking
    order: 10
    help: "Enable VNet integration to route outbound traffic through a virtual network."

  vnet_integration_subnet_id:
    widget: resource_picker
    widget_options: { resource_type: subnet }
    group: networking
    order: 20
    help: "Subnet for VNet integration (outbound traffic). Required when enable_vnet_integration is true."
    show_when:
      enable_vnet_integration: true
    required_when:
      enable_vnet_integration: true

  enable_private_endpoint:
    widget: toggle
    group: networking
    order: 30
    help: "Create a private endpoint for inbound traffic. Requires subnet_id and private_dns_zone_id."

  subnet_id:
    widget: resource_picker
    widget_options: { resource_type: subnet }
    group: networking
    order: 40
    help: "Subnet that hosts the private endpoint NIC. Required when enable_private_endpoint is true."
    show_when:
      enable_private_endpoint: true
    required_when:
      enable_private_endpoint: true

  private_dns_zone_id:
    widget: resource_picker
    widget_options: { resource_type: private_dns_zone }
    group: networking
    order: 50
    help: "Private DNS zone for privatelink.azurewebsites.net. Required when enable_private_endpoint is true."
    show_when:
      enable_private_endpoint: true
    required_when:
      enable_private_endpoint: true

  # --- Private endpoint name overrides (hidden; naming engine provides defaults) ---
  private_endpoint_name:
    widget: hidden
    derived_from: { source: hcl_default }

  private_service_connection_name:
    widget: hidden
    derived_from: { source: hcl_default }

  private_endpoint_nic_name:
    widget: hidden
    derived_from: { source: hcl_default }

  # --- Monitoring ---
  enable_application_insights:
    widget: toggle
    group: monitoring
    order: 10
    help: "Connect this Function App to Application Insights for distributed tracing, performance monitoring, and live metrics."

  application_insights_connection_string:
    widget: text
    group: monitoring
    order: 20
    sensitive_override: true
    placeholder: "InstrumentationKey=...;IngestionEndpoint=..."
    help: "Application Insights connection string. Required when enable_application_insights is true. Wire from an Application Insights module output."
    show_when:
      enable_application_insights: true
    required_when:
      enable_application_insights: true

  diagnostic_settings:
    widget: object
    widget_options:
      fields:
        name:
          widget: text
          placeholder: "diag-<function-app-name>"
        log_analytics_workspace_id:
          widget: resource_picker
          widget_options: { resource_type: log_analytics_workspace }
        storage_account_id:
          widget: resource_picker
          widget_options: { resource_type: storage_account }
        eventhub_authorization_rule_id:
          widget: text
        eventhub_name:
          widget: text
        log_analytics_destination_type:
          widget: select
          widget_options:
            options: ["Dedicated", "AzureDiagnostics"]
        enabled_log_categories:
          widget: text
          widget_options: { multiline: true }
          help: "One category per line. Leave empty for all supported categories."
        enabled_metrics:
          widget: text
          widget_options: { multiline: true }
          help: "One metric per line. Leave empty for all supported metrics."
    group: monitoring
    order: 30
    advanced: true
    help: "Optional diagnostic settings. Leave blank to disable. At least one destination sink must be provided when set."

composition_contract:
  version: v1
  required_resources:
  - requirement_id: function-app.service_plan_id
    variable: service_plan_id
    role: resource_binding
    necessity: required
    resource_type: app_service_plan
    cardinality: one
    compatible_providers:
    - app-service-plan
    recommended_provider: app-service-plan
    existing_resource:
      supported: true
      discovery_kind: azure-resource-id
    external_changes:
      allowed: false
  - requirement_id: function-app.storage_account_name
    variable: storage_account_name
    role: resource_binding
    necessity: required
    resource_type: storage_account
    cardinality: one
    compatible_providers:
    - storage-account
    recommended_provider: storage-account
    existing_resource:
      supported: true
      discovery_kind: azure-resource-id
    external_changes:
      allowed: false
  - requirement_id: function-app.vnet_integration_subnet_id
    variable: vnet_integration_subnet_id
    role: network_placement
    necessity: optional
    resource_type: subnet
    cardinality: one
    compatible_providers:
    - virtual-network
    recommended_provider: virtual-network
    existing_resource:
      supported: true
      discovery_kind: azure-resource-id
    external_changes:
      allowed: false
  - requirement_id: function-app.subnet_id
    variable: subnet_id
    role: network_placement
    necessity: optional
    resource_type: subnet
    cardinality: one
    compatible_providers:
    - virtual-network
    recommended_provider: virtual-network
    existing_resource:
      supported: true
      discovery_kind: azure-resource-id
    external_changes:
      allowed: false
  - requirement_id: function-app.private_dns_zone_id
    variable: private_dns_zone_id
    role: resource_binding
    necessity: optional
    resource_type: private_dns_zone
    cardinality: one
    compatible_providers:
    - private-dns-zone
    recommended_provider: private-dns-zone
    existing_resource:
      supported: true
      discovery_kind: azure-resource-id
    external_changes:
      allowed: false
  - requirement_id: function-app.user_assigned_identity_ids
    variable: user_assigned_identity_ids
    role: resource_binding
    necessity: optional
    resource_type: user_assigned_identity
    cardinality: many
    compatible_providers:
    - user-assigned-identity
    recommended_provider: user-assigned-identity
    existing_resource:
      supported: true
      discovery_kind: azure-resource-id
    external_changes:
      allowed: false
  - requirement_id: function-app.application_insights_connection_string
    variable: application_insights_connection_string
    role: resource_binding
    necessity: optional
    resource_type: application_insights
    cardinality: one
    compatible_providers:
    - application-insights
    - log-analytics-workspace
    recommended_provider: application-insights
    existing_resource:
      supported: true
      discovery_kind: azure-resource-id
    external_changes:
      allowed: false
  - requirement_id: function-app.diagnostic_settings.log_analytics_workspace_id
    variable: diagnostic_settings.log_analytics_workspace_id
    role: resource_binding
    necessity: optional
    resource_type: log_analytics_workspace
    cardinality: one
    compatible_providers:
    - log-analytics-workspace
    recommended_provider: log-analytics-workspace
    existing_resource:
      supported: true
      discovery_kind: azure-resource-id
    external_changes:
      allowed: false
  - requirement_id: function-app.diagnostic_settings.storage_account_id
    variable: diagnostic_settings.storage_account_id
    role: resource_binding
    necessity: optional
    resource_type: storage_account
    cardinality: one
    compatible_providers:
    - storage-account
    recommended_provider: storage-account
    existing_resource:
      supported: true
      discovery_kind: azure-resource-id
    external_changes:
      allowed: false

dependencies:
  required_inputs_from_other_resources:
    - variable: service_plan_id
      resource_type: app_service_plan
      cardinality: one
      notes: "Dedicated App Service Plan hosting this Function App."
    - variable: storage_account_name
      resource_type: storage_account
      cardinality: one
      notes: "Storage account for Functions runtime state and binding storage."
    - variable: vnet_integration_subnet_id
      resource_type: subnet
      cardinality: one
      notes: "Required when enable_vnet_integration is true."
    - variable: subnet_id
      resource_type: subnet
      cardinality: one
      notes: "Required when enable_private_endpoint is true."
    - variable: private_dns_zone_id
      resource_type: private_dns_zone
      cardinality: one
      notes: "Required when enable_private_endpoint is true."
    - variable: user_assigned_identity_ids
      resource_type: user_assigned_identity
      cardinality: many
      notes: "Optional user-assigned managed identities."
    - variable: application_insights_connection_string
      resource_type: application_insights
      cardinality: one
      notes: "Required when enable_application_insights is true."
    - variable: diagnostic_settings.log_analytics_workspace_id
      resource_type: log_analytics_workspace
      cardinality: one
      notes: "Optional diagnostic sink."
    - variable: diagnostic_settings.storage_account_id
      resource_type: storage_account
      cardinality: one
      notes: "Optional diagnostic sink."

  produces_outputs_consumable_by:
    - output: id
      resource_type: function_app
    - output: default_hostname
      resource_type: function_app

outputs_display:
  id:
    display_name: "Resource ID"
    show_in_summary: true
    copyable: true
    format: arm_id

  name:
    display_name: "Function App name"
    show_in_summary: true
    copyable: true

  default_hostname:
    display_name: "Default hostname"
    show_in_summary: true
    copyable: true
    format: url

  outbound_ip_addresses:
    display_name: "Outbound IP addresses"
    show_in_summary: false
    copyable: true

  principal_id:
    display_name: "System identity principal ID"
    show_in_summary: false
    copyable: true

  tenant_id:
    display_name: "System identity tenant ID"
    show_in_summary: false
    copyable: true

  private_endpoint_id:
    display_name: "Private endpoint ID"
    show_in_summary: false
    copyable: true
    format: arm_id

  private_ip_address:
    display_name: "Private IP address"
    show_in_summary: false
    copyable: true

  public_function_app_id:
    display_name: "Resource ID (public)"
    show_in_summary: false
    copyable: true
    format: arm_id
    role: public_alias

  public_function_app_name:
    display_name: "Function App name (public)"
    show_in_summary: false
    copyable: true
    role: public_alias
